name: Build CardamomAI APK

# Builds a release APK on GitHub's own clean Ubuntu servers instead of
# your local machine — sidesteps Windows-specific antivirus/Kotlin
# incremental-cache issues entirely. Runs automatically on every push
# to main, and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardamom-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
