# Keep a single Gradle JVM configuration.  The later duplicate value used to
# override this line and leave Gradle without an explicit heap limit.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+IgnoreUnrecognizedVMOptions --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin daemon processes were repeatedly cancelled during Android builds on
# this machine. Compiling in Gradle's process removes that fragile extra
# daemon while preserving the app's code and output.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false